name: Todo App CI/CD

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          flake8 app run.py tests

      - name: Run tests
        run: |
          pytest

  docker:
    name: Build and Push Docker Image

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set version
        id: version
        run: |
          VERSION="v1.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:${{ steps.version.outputs.version }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest \
            .

      - name: Push version image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:${{ steps.version.outputs.version }}

      - name: Push latest image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest