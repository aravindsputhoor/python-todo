<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo Application</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>My Todo List</h1>

    <form id="todo-form">

        <input
            type="text"
            id="todo-title"
            placeholder="Enter a todo..."
            required
        >

        <button type="submit">
            Add Todo
        </button>

    </form>

    <ul id="todo-list"></ul>

</div>

<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>

</body>

</html>
